[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-link-auditor"
version = "0.1.0"
description = "Find broken local links in Markdown documentation"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
markdown-link-auditor = "link_auditor:main"
